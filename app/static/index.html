<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supply Chain Shipping Mode Predictor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        #form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .button-container {
            grid-column: 1 / -1;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            text-align: center;
            background: #eef6ff;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            #form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Supply Chain Shipping Mode Predictor</h1>

        <p class="subtitle">
            Enter the required supply chain details
        </p>

        <form id="form">

            <!-- Actual model features will be added here -->

            <div class="button-container">
                <button type="submit">
                    Predict Shipping Mode
                </button>
            </div>

        </form>

        <div id="result">
            Prediction will appear here
        </div>

    </div>


    <script>

        const form = document.getElementById("form");
        const result = document.getElementById("result");

        // Load actual feature names from FastAPI
        async function loadFeatures() {

            try {

                const response = await fetch("/");

                const data = await response.json();

                const features = data.features;

                features.forEach(feature => {

                    const div = document.createElement("div");

                    div.className = "form-group";

                    const label = document.createElement("label");

                    label.innerText = feature;

                    const input = document.createElement("input");

                    input.type = "text";

                    input.name = feature;

                    input.required = true;

                    div.appendChild(label);
                    div.appendChild(input);

                    form.insertBefore(
                        div,
                        form.querySelector(".button-container")
                    );

                });

            } catch (error) {

                result.innerText =
                    "Unable to load model features.";

                console.error(error);
            }
        }


        // Prediction
        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const inputs = form.querySelectorAll("input");

            const features = {};

            inputs.forEach(input => {

                const value = input.value;

                // Convert numeric values to numbers
                if (value !== "" && !isNaN(value)) {
                    features[input.name] = Number(value);
                } else {
                    features[input.name] = value;
                }

            });

            result.innerText = "Predicting...";

            try {

                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        features: features
                    })
                });

                const data = await response.json();

                if (response.ok) {

                    result.innerText =
                        "Predicted Shipping Mode: " +
                        data.prediction;

                } else {

                    result.innerText =
                        "Prediction Error: " +
                        JSON.stringify(data);

                }

            } catch (error) {

                result.innerText =
                    "Server connection error.";

                console.error(error);
            }

        });


        // Start
        loadFeatures();

    </script>

</body>

</html>
